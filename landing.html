<style>
  body { background:#FAFBFD; margin:0; padding:0; }
  .bg-noise { background-image: radial-gradient(circle at 1px 1px, rgba(15,18,34,.05) 1px, transparent 0); background-size: 22px 22px; }
  ::-webkit-scrollbar { width:6px; height:6px }
  ::-webkit-scrollbar-thumb { background:#DDE1ED; border-radius:4px }

  @keyframes floatSlow {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }
  .animate-float { animation: floatSlow 4s ease-in-out infinite; }

  @keyframes pulseGlow {
    0%, 100%  { box-shadow: 0 0 0 0 var(--glow-color, rgba(238,77,45,.5)); }
    70%       { box-shadow: 0 0 0 9px var(--glow-color-end, rgba(238,77,45,0)); }
  }
  .animate-pulse-glow { animation: pulseGlow 1.8s cubic-bezier(0.4,0,0.6,1) infinite; }

  /* ── PARALLAX BACKDROP (Hero) ── */
  .parallax-layer{
    position:absolute; inset:-10% -5%; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(238,77,45,.08) 0, transparent 42%),
      radial-gradient(circle at 85% 20%, rgba(17,51,102,.10) 0, transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(238,77,45,.05) 0, transparent 45%);
    will-change: transform;
  }
  .hero-gradient{
    background: linear-gradient(150deg, #FFF9F6 0%, #FFFFFF 45%, #EFF4FF 100%);
  }
  .dashboard-gradient{
    background: linear-gradient(160deg, #FFF1EC 0%, #FDF7F5 30%, #F4F7FC 65%, #EAF0FB 100%);
    position: relative;
  }
  .dashboard-gradient::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(circle at 8% 12%, rgba(238,77,45,.10) 0, transparent 38%),
      radial-gradient(circle at 92% 85%, rgba(17,51,102,.12) 0, transparent 42%);
  }
  .dashboard-gradient > *{ position:relative; z-index:1; }

  /* ── 3D TILT INTERACTIVE ── */
  .tilt-3d{ transition: transform .12s ease-out, box-shadow .2s ease; transform-style: preserve-3d; will-change: transform; }

  /* ── GLOW EFFECT cho CTA chính ── */
  .glow-ring{ position:relative; }
  .glow-ring::before{
    content:''; position:absolute; inset:-2px; border-radius:inherit; z-index:-1;
    background:linear-gradient(135deg,#EE4D2D,#113366,#EE4D2D);
    background-size:220% 220%; opacity:0; filter:blur(10px);
    transition:opacity .25s; animation: glowShift 4s ease infinite;
  }
  .glow-ring:hover::before{ opacity:.4 }
  @keyframes glowShift{
    0%,100%{ background-position:0% 50% }
    50%{ background-position:100% 50% }
  }

  /* ── UNDERLIGHT cho nav links ── */
  .nav-underlight{ position:relative; padding-bottom:3px; }
  .nav-underlight::after{
    content:''; position:absolute; left:50%; bottom:0; width:0; height:2px;
    background:#EE4D2D; border-radius:2px; transform:translateX(-50%);
    box-shadow:0 0 8px rgba(238,77,45,.7);
    transition:width .25s ease;
  }
  .nav-underlight:hover::after{ width:100%; }

  /* ── HERO FLOATING DECOR ICONS ── */
  .hero-float-icon{
    position:absolute; z-index:1; font-size:32px; opacity:.55;
    filter:drop-shadow(0 6px 14px rgba(17,51,102,.14));
    pointer-events:none; user-select:none;
  }
  @media (max-width:900px){ .hero-float-icon{ display:none; } }

  /* ── NAVY-TINTED BORDER ── */
  .border-navy-tint{ border-color: rgba(17,51,102,.09) !important; }

  /* ── CUSTOM CURSOR ── */
  body.has-custom-cursor { cursor: none; }
  #customCursor{
    position: fixed; top:0; left:0; width:20px; height:20px; border-radius:50%;
    border:2px solid #EE4D2D; pointer-events:none; z-index:9999;
    transform: translate(-50%,-50%); transition: width .15s, height .15s, background .15s, border-color .15s, opacity .15s;

  }

  #customCursor.hover{ width:42px; height:42px; background:rgba(238,77,45,.12); border-color:#113366; }
  @media (max-width:900px), (hover:none){
    #customCursor{ display:none !important }
    body.has-custom-cursor{ cursor:auto !important }
  }
</style>

<!-- ═══════════════════════════ EFFECTS: Custom Cursor · Parallax · 3D Tilt ═══════════════════════════ -->
<div id="customCursor"></div>
<script>
(function(){
  var isTouch = window.matchMedia('(hover: none)').matches || window.innerWidth < 900;
  var cursor = document.getElementById('customCursor');

  if (!isTouch && cursor) {
    document.body.classList.add('has-custom-cursor');
    document.addEventListener('mousemove', function(e){
      cursor.classList.add('active');
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });
    document.addEventListener('mouseleave', function(){ cursor.classList.remove('active'); });
    document.addEventListener('mouseover', function(e){
      if (e.target.closest('a, button, .tilt-3d')) cursor.classList.add('hover');
    });
    document.addEventListener('mouseout', function(e){
      if (e.target.closest('a, button, .tilt-3d')) cursor.classList.remove('hover');
    });
  }

  // ── Parallax ──
  var parallaxTicking = false;
  function updateParallax(){
    var layer = document.getElementById('parallaxLayer');
    if (layer) {
      var y = window.scrollY || 0;
      layer.style.transform = 'translateY(' + (y * 0.25) + 'px)';
    }
    parallaxTicking = false;
  }
  window.addEventListener('scroll', function(){
    if (!parallaxTicking) { requestAnimationFrame(updateParallax); parallaxTicking = true; }
  }, { passive: true });

  // ── 3D Tilt Hover ──
  document.addEventListener('mousemove', function(e){
    var card = e.target.closest && e.target.closest('.tilt-3d');
    if (!card) return;
    var r = card.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;
    var py = (e.clientY - r.top) / r.height;
    var rx = (0.5 - py) * 5;
    var ry = (px - 0.5) * 5;
    card.style.transform = 'perspective(900px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) translateY(-2px)';
  });
  document.addEventListener('mouseout', function(e){
    var card = e.target.closest && e.target.closest('.tilt-3d');
    if (card && (!e.relatedTarget || !card.contains(e.relatedTarget))) {
      card.style.transform = '';
    }
  });
})();
</script>
